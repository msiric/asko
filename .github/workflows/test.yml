name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck setup.sh scripts/*.sh tests/run-all.sh

      - name: Validate LiteLLM YAML
        run: python3 -c "import yaml; yaml.safe_load(open('config/litellm/config.yaml.template'))"

      - name: Validate IronClaw TOML
        run: python3 -c "import tomllib; tomllib.loads(open('config/ironclaw/config.toml.template').read())"

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy on docker-compose.yml
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose.yml'
          severity: 'CRITICAL,HIGH'

  unit-tests:
    name: Unit & Template Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install BATS
        run: sudo apt-get install -y bats

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Create dummy .env for compose validation
        run: cp .env.example .env

      - name: Run tests
        run: make test
