# asko — Security-first self-hosted AI assistant stack
# https://github.com/msiric/asko

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # === DATA LAYER ===

  postgres:
    image: pgvector/pgvector:pg16
    container_name: asko-postgres
    networks:
      - asko_backend
      - asko_automation
    volumes:
      - asko_postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "max_connections=200"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH
    shm_size: '256m'
    restart: unless-stopped

  # === SEARCH LAYER ===

  searxng:
    # :latest is intentional — SearXNG uses commit-hash tags (e.g. 2024.12.22-c36a2a54d)
    # that are impractical to pin. Internal-only service, not on proxy network.
    image: searxng/searxng:latest
    container_name: asko-searxng
    networks:
      - asko_backend
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # === INFERENCE LAYER ===

  ollama:
    image: ollama/ollama:0.17.1
    container_name: asko-ollama
    networks:
      - asko_backend
    volumes:
      - asko_ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.81.12-stable
    container_name: asko-litellm
    networks:
      - asko_proxy
      - asko_backend
      - asko_agents
      - asko_automation
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
      - asko_litellm_data:/app/data
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # === AGENT LAYER ===
  # NOTE: IronClaw does not publish official Docker images.
  # Install it on the host instead: curl -fsSL https://ironclaw.sh | sh
  # Then run: ironclaw onboard

  # === UI LAYER ===

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.5
    container_name: asko-openwebui
    networks:
      - asko_proxy
      - asko_backend
    volumes:
      - asko_openwebui_data:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
      ENABLE_RAG_WEB_SEARCH: "True"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      RAG_WEB_SEARCH_RESULT_COUNT: "3"
    depends_on:
      litellm:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # === AUTOMATION LAYER ===

  n8n:
    image: n8nio/n8n:1.76.1
    container_name: asko-n8n
    networks:
      - asko_proxy
      - asko_automation
    volumes:
      - asko_n8n_data:/home/node/.n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: asko_n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_NODES_EXCLUDE: '["n8n-nodes-base.git"]'
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      WEBHOOK_URL: http://n8n:5678/
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  waha:
    image: devlikeapro/waha:latest
    container_name: asko-waha
    profiles: ["whatsapp"]
    networks:
      - asko_automation
    volumes:
      - asko_waha_data:/app/data
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "true"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # === LANGUAGE LEARNING (opt-in: --profile linguacafe) ===

  linguacafe:
    image: ghcr.io/simjanos-dev/linguacafe-webserver:v0.14.1
    container_name: asko-linguacafe
    profiles: ["linguacafe"]
    networks:
      - asko_linguacafe
    ports:
      - "9191:80"
    volumes:
      - asko_linguacafe_storage:/var/www/html/storage
    environment:
      DB_DATABASE: linguacafe
      DB_USERNAME: linguacafe
      DB_PASSWORD: ${LINGUACAFE_DB_PASSWORD}
      DB_HOST: linguacafe-db
      DB_PORT: "3306"
    depends_on:
      linguacafe-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  linguacafe-db:
    image: mysql:8.0
    container_name: asko-linguacafe-db
    profiles: ["linguacafe"]
    networks:
      - asko_linguacafe
    volumes:
      - asko_linguacafe_db:/var/lib/mysql
    environment:
      MYSQL_DATABASE: linguacafe
      MYSQL_USER: linguacafe
      MYSQL_PASSWORD: ${LINGUACAFE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LINGUACAFE_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    restart: unless-stopped

  linguacafe-redis:
    image: redis:7.2-alpine
    container_name: asko-linguacafe-redis
    profiles: ["linguacafe"]
    networks:
      - asko_linguacafe
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: unless-stopped

  linguacafe-nlp:
    image: ghcr.io/simjanos-dev/linguacafe-python-service:v0.14.1
    container_name: asko-linguacafe-nlp
    profiles: ["linguacafe"]
    networks:
      - asko_linguacafe
    command: python3 tokenizer.py
    volumes:
      - asko_linguacafe_storage:/var/www/html/storage/app/model
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # === PROXY LAYER ===

  caddy:
    image: caddy:2.9-alpine
    container_name: asko-caddy
    networks:
      - asko_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - asko_caddy_data:/data
      - asko_caddy_config:/config
    depends_on:
      open-webui:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || wget -q --spider --no-check-certificate https://localhost:443/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
    restart: unless-stopped

# === NETWORKS ===

networks:
  asko_proxy:
    driver: bridge
  asko_backend:
    driver: bridge
  asko_agents:
    driver: bridge
  asko_automation:
    driver: bridge
  asko_linguacafe:
    driver: bridge

# === VOLUMES ===

volumes:
  asko_postgres_data:
  asko_ollama_models:
  asko_litellm_data:
  asko_n8n_data:
  asko_waha_data:
  asko_openwebui_data:
  asko_caddy_data:
  asko_caddy_config:
  asko_linguacafe_storage:
  asko_linguacafe_db:
